<!-- ABOUTME: Source of the VarioLink for Suunto store banner (upload/1-banner-600x300.png, exactly 600x300), rendered with the SuuntoPlus Editor's headless Chrome. -->
<!-- ABOUTME: Text left, the app's own simulator screenshot (upload/2-app-image-466.png) right; no Stodeus or Suunto logos, product photos or watch photos. -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>VarioLink for Suunto banner</title>
<style>
  :root { --bg: #070a0e; --fg: #ffffff; --mid: #9aa4ae; --accent: #3ff07f; --ring: #2a3138; }
  html, body { margin: 0; width: 600px; height: 300px; overflow: hidden; background: var(--bg); color: var(--fg);
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
  .text { position: absolute; left: 32px; top: 50%; transform: translateY(-50%); width: 300px; }
  h1 { margin: 0 0 8px; font-size: 38px; line-height: 1.05; font-weight: 700; letter-spacing: -0.5px; }
  h1 span { color: var(--accent); }
  h1 small { font-size: 18px; font-weight: 600; color: var(--mid); letter-spacing: 0.5px; }
  .sub { margin: 0 0 16px; font-size: 14px; line-height: 1.35; color: var(--mid); }
  ul { margin: 0; padding: 0; list-style: none; font-size: 13px; line-height: 1.8; }
  li::before { content: ""; display: inline-block; width: 6px; height: 6px; margin: 0 10px 2px 0; border-radius: 50%; background: var(--accent); }
  .watch { position: absolute; right: 34px; top: 22px; width: 256px; height: 256px; border-radius: 50%; border: 8px solid var(--ring);
    box-sizing: border-box; overflow: hidden; background: #000; }
  .watch img { width: 100%; height: 100%; display: block; }
  .note { position: absolute; left: 32px; bottom: 12px; font-size: 9px; color: var(--mid); }
</style>
</head>
<body>
  <div class="text">
    <h1>Vario<span>Link</span><br><small>for Suunto</small></h1>
    <p class="sub">Your Bluetooth vario's numbers<br>on your watch.</p>
    <ul>
      <li>Big climb rate, 10-30 s average</li>
      <li>Thermal gain, altitude, flight time</li>
      <li>Watch barometer if the link drops</li>
      <li>Logged to your exercise</li>
    </ul>
  </div>
  <div class="watch"><img src="upload/2-app-image-466.png" alt=""></div>
  <div class="note">Independent app, not affiliated with Stodeus or Suunto.</div>
</body>
</html>

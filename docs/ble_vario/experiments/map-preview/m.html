<!-- ABOUTME: Thermal map preview template: synthetic 120-s trail (22-s circles drifting in a 5 m/s west wind, glide in from -->
<!-- ABOUTME: the west), north up, centred on the glider; red = lift, blue = sink, darker = older; current lift small at the bottom. -->
<uiView onLoad="
  var T = 0, tok = 0, R = 60, WE = 5; // view radius (m); wind to the east (m/s): older points shift downwind, so circles stack
  // synthetic position (m east, north) and climb (m/s) at time s seconds into the scenario
  var px = 0, py = 0, pv = 0;
  var at = function (s) {
    var a;
    if (s < 40) { px = -260 + 6.5 * s; py = -40 + 1 * s; pv = -1.2 + 0.3 * Math.sin(s * 0.7); return; }
    s -= 40;
    a = s * 6.2832 / 22;
    px = 5 * s + 25 * Math.sin(a);
    py = 25 * Math.cos(a) - 25;
    pv = 1.2 + 1.7 * Math.cos(a - 1.2) + 0.25 * Math.sin(s * 1.3);
  };
  // colour bucket: lift 3 levels red, sink 2 levels blue, neutral grey; age band 0-2 darkens it
  var COL = [
    ['#2266FF', '#1A4DBF', '#11337F'], ['#33B0FF', '#2684BF', '#19587F'], ['#888888', '#666666', '#444444'],
    ['#FF9090', '#BF6C6C', '#7F4848'], ['#FF4040', '#BF3030', '#7F2020'], ['#FF0000', '#BF0000', '#7F0000']];
  var bucket = function (v) { return v <= -2 ? 0 : (v <= -0.7 ? 1 : (v < 0.3 ? 2 : (v < 1.5 ? 3 : (v < 2.5 ? 4 : 5)))); };
  var draw = function (c) {
    var w2 = c.width / 2, h2 = c.height / 2, s = (Math.min(w2, h2) - 6) / R, now = 20 + (T % 120), ox, oy, a, st, b, band,
      key, last = -1, n = 0, units = 0, x, y;
    at(now); ox = px; oy = py;
    for (a = 110; a > 0 && units < 150; a -= st) {
      st = a > 60 ? 3 : (a > 30 ? 2 : 1);
      if (now - a < 0) continue;
      at(now - a + st / 2); b = bucket(pv); band = a > 60 ? 2 : (a > 25 ? 1 : 0);
      key = b * 3 + band;
      if (key !== last || n >= 20) {
        if (last >= 0) { c.stroke(); units += 2; }
        c.beginPath(); c.strokeStyle = COL[b][band]; c.lineWidth = b > 2 ? 6 : 3;
        at(now - a); c.moveTo(w2 + (px + WE * a - ox) * s, h2 - (py - oy) * s); units++; n = 0; last = key;
      }
      at(now - a + st); x = w2 + (px + WE * (a - st) - ox) * s; y = h2 - (py - oy) * s; c.lineTo(x, y); n++; units++;
    }
    if (last >= 0) { c.stroke(); }
    c.beginPath(); c.strokeStyle = '#FFFFFF'; c.lineWidth = 3;      // glider: short white tick along the track
    at(now - 1); c.moveTo(w2 + (px + WE - ox) * s, h2 - (py - oy) * s); c.lineTo(w2, h2); c.stroke();
    c.beginPath(); c.strokeStyle = '#FFFFFF'; c.lineWidth = 2;      // north tick
    c.moveTo(w2, 2); c.lineTo(w2, 14); c.stroke();
  };
  var tick = function (v) {
    var t;
    if (isFinite(v)) T = v;
    at(20 + (T % 120));
    t = Math.round(pv * 10);
    setText('#lv', (t > 0 ? '+' : (t < 0 ? '-' : '')) + Math.floor(Math.abs(t) / 10) + '.' + Math.abs(t) % 10 + ' m/s');
    try { control('#map', 'REFRESH'); } catch (e) {}
  };
"
onActivate="
  try { tok = $.subscribe('Zapp/{zapp_index}/Output/tk', function (i, v) { tick(v); }.bind(null, 0)); } catch (e) {}
  try { $.get('Zapp/{zapp_index}/Output/tk', function (i, v) { tick(v); }.bind(null, 0)); } catch (e) {}
"
onDeactivate="
  if (tok) { try { $.unsubscribe(tok); } catch (e) {} } tok = 0;
">
  <div style="width:100%;height:100%;background-color:#000000;">
    <object id="map" type="canvas" build="ctx => draw(ctx)" style="position:absolute;top:4%;left:4%;width:92%;height:80%;" />
    <div id="lv" class="sp-t-m p-hc" style="top:85%;">--</div>
  </div>
</uiView>
